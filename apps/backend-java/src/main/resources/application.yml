spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  application:
    name: timixa-backend

server:
  port: 8080

app:
  jwt:
    secret: ${TIMIXA_JWT_SECRET:dev-secret-change-me-in-prod-needs-to-be-at-least-32-bytes-long}
    expiry-seconds: 604800   # 7 days
  legacy:
    base-url: http://localhost:3000
